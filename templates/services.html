{% extends "base.html" %}
{% block content %}

<style>

/* Section */

.section{
    padding:60px 20px;
    text-align:center;
}

.section h2{
    font-size:32px;
    margin-bottom:40px;
}d

/* Services */

.services-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:white;
    padding:30px;
    width:220px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    font-weight:600;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

</style>

<section class="section">

<h2>Our Services</h2>

<div class="services-list">
    <div class="card">Online Training</div>
    <div class="card">Offline Training</div>
    <div class="card">Corporate Training</div>
    <div class="card">Certification Courses</div>
    <div class="card">Career Guidance</div>
</div>

</section>


<!-- Floating Buttons -->

<a class="whatsapp-btn" href="https://wa.me/91XXXXXXXXXX" target="_blank">
WhatsApp
</a>

<button class="enquiry-btn" onclick="openForm()">Enquiry</button>

<div id="popupForm" class="popup-overlay">

<div class="popup-box">

<span class="close-btn" onclick="closeForm()">×</span>

<h2 style="text-align:center;">Enquiry Form</h2>

<form action="https://formsubmit.co/vinayakmalode76@gmail.com" method="POST" class="contact-form">

<input type="hidden" name="_captcha" value="false">

<input type="text" name="name" placeholder="Your Name" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<select name="course">
<option>Select Course</option>
<option>Python</option>
<option>Data Science</option>
<option>Software Testing</option>
<option>Computer Course</option>
</select>

<textarea name="message" placeholder="Message" rows="3"></textarea>

<button type="submit" class="submit-btn">Submit Enquiry</button>

</form>

</div>
</div>

<script>

function toggle(id){
document.getElementById(id).classList.toggle("show");
}

function openForm(){
document.getElementById("popupForm").style.display="flex";
}

function closeForm(){
document.getElementById("popupForm").style.display="none";
}

setTimeout(function(){
document.getElementById("popupForm").style.display="flex";
},10000);

</script>

{% endblock %}
