{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="enquiry-popup.css">
<section class="section">
    <h2>Training Gallery</h2>

    <div class="gallery-grid">
        {% for img in images %}
        <img src="static/uploads\\WhatsApp Image 2026-02-18 at 9.50.10 PM.jpeg" alt="Gallery Image">
        {% endfor %}
    </div>
    <script src="enquiry-popup.js"></script>
</section>
<a class="whatsapp-btn"
   href="https://wa.me/91XXXXXXXXXX"
   target="_blank">

    WhatsApp

</a>


<!-- ENQUIRY BUTTON -->

<button class="enquiry-btn" onclick="openForm()">

    Enquiry

</button>


<!-- POPUP FORM -->

<div id="popupForm" class="popup-overlay">

    <div class="popup-box">

        <span class="close-btn" onclick="closeForm()">×</span>

        <h2 style="text-align:center;">Enquiry Form</h2>

        <form
            action="https://formsubmit.co/vinayakmalode76@gmail.com"
            method="POST"
            class="contact-form">

            <input type="hidden" name="_captcha" value="false">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required
            >

            <select name="course">

                <option>Select Course</option>
                <option>Python Full Stack</option>
                <option>Data Science</option>
                <option>Software Testing</option>
                <option>Computer Course</option>

            </select>

            <textarea
                name="message"
                placeholder="Message"
                rows="3"
            ></textarea>

            <button type="submit" class="submit-btn">

                Submit Enquiry

            </button>

        </form>

    </div>

</div>


<script>

/* OPEN POPUP */

function openForm() {
    document.getElementById("popupForm").style.display = "flex";
}

/* CLOSE POPUP */

function closeForm() {
    document.getElementById("popupForm").style.display = "none";
}

/* AUTO POPUP AFTER 10 SECONDS */

setTimeout(function () {

    document.getElementById("popupForm").style.display = "flex";

}, 10000);

</script>
{% endblock %}
